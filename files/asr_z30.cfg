	nlp-sections {
		!beacon nlp-section-root
		BLANK {
			recognizer = dragon
			recognizer = vocon3200 {
			    speaker-adaptation = 0
			}
			maluuba_hint = "\\\"handlerType\\\":\\\"BLANK\\\""
			intent {
				<$(@media)/intent>
				<$(@msg)/intent>
				<$(@search)/intent>
				<$(@launch)/intent>
				<$(@memo)/intent>
				<$(@nav)/intent:test(ADD_PLACE,done(200000),done(1000))>
				<$(@wa)/intent>
				<$(@addr)/intent>
#				<$(@reader)/intent>
#				<$(@settings)/intent>
#				<$(@cal)/intent>
			}
		}
	#	BBNLP / Vocon sections

	#	WEATHER_STATUS_LOCATION = intent {
	#		maluuba_hint = "\\\"handlerType\\\":\\\"CONTEXTUAL\\\",\\\"frameClassification\\\":\\\"WEATHER_STATUS\\\""
	#		[and' '](what|how)' '(about|for)' '<.. ..:id(LOCATION),id(intent,WEATHER_STATUS)>[[(on|at|by)' '](<$(@ddt)/time-extract>|<$(@ddt)/weekdays-extract>)<.. ..>]
	#	}
		DICTATION {
			maluuba_hint = disabled
			recognizer = dragon
			recognizer = vocon3200 {
				context = \$(rec-locale-dir)/vocon3200/dictation.fcf
			}
			intent {
				(~\0:id(TEXT,~),id(intent,DICTATION),bonus(500000))
			}
		}
		CONTACT_SINGLE {
			maluuba_hint = disabled
			recognizer = dragon
			recognizer = vocon3200 {
				garbage-sensitivity = 56
				context = \$(locale-dir)/bb10_addrbook/dial.fcf {
					loadslot {
						PersonalTo {
							context = trained/bb10_addrbook/addressbook.lcf
						}
						
						EnterpriseTo {
							context = $(enterprise-home-dir)/trained/bb10_addrbook/addressbook.lcf
						}
					}
					deactivate {
						*
					}
					activate {
						contact
						phone-number
						cancel
						HELP_HELP
						back
					}
				}
			}
			intent { # collect contact and/or phone-number, if voicemail, VOICEMAIL = true (using single contact local grammar)
				# Having the rule set at the beginning allows sub-rules to override the intent classification (ie. CALL_CALLING_VOICEMAIL)
				((:id(!rule,CONTACT_SINGLE),bonus(200000))\
				(<$(@addr)/intent>\
				| <$(@iddt)/phone-digits:bonus(250000)> [<ext-spec>]\
				| [<$(@msg)/all-dm>](~(\0|(\ (at|to)\ <$(@ddt)/digit-seq:cat(_x, !digits)>))\
				:test(_x,(cat(!PHONENUMBER,!_x),id(!CONTACTNAME,~)),id(!CONTACTNAME,~)))):id(nlp_post,nbest_single))\
				(~\0)
			}
		}
		CONTACT {
			maluuba_hint = disabled
			recognizer = dragon
			recognizer = vocon3200
			hidden_recognizer = vocon3200 {
			        garbage-sensitivity = 56
#					context = \$(locale-dir)/bb10_addrbook/dial.fcf
					context = \$(locale-dir)/messages/messages.fcf {
					loadslot {
						PersonalTo {
							context = trained/bb10_addrbook/addressbook.lcf
						}
						
						EnterpriseTo {
							context = $(enterprise-home-dir)/trained/bb10_addrbook/addressbook.lcf
						}
					}
					deactivate {
						*
					}
					activate {
						contact
						cancel
						HELP_HELP
						back
					}
				}
			}
			intent { # collect contacts and phone-numbers, if voicemail, VOICEMAIL = true (using single contact local grammar, multiple available if network is up)
				( <$(@addr)/intent>\
				| <$(@iddt)/phone-digits:bonus(250000)> [<ext-spec>]\
				| [<$(@msg)/all-dm>](~(\0|((,[' ']|<$(@msg)/contact-separator>)<intent>|\ <$(@msg)/phone-number-indicator><$(@ddt)/digit-seq:cat(_x, !digits)>)):test(_x,cat(+PHONENUMBER,!_x,':',~),id(CONTACTNAME,~)))\
				:id(!rule,CONTACT),bonus(200000))[(,[' ']|and' ')<intent>]
			}
		}
		PHONENUMBER {
			maluuba_hint = disabled
			intent {
				<$(@ddt)/digit-dialing:bonus(250000)>
			}
		}
		MEMO {
			maluuba_hint = disabled
			intent {
				(<$(@memo)/title-spec:id(intent,NOTE_SET)> | (~\0:id(intent,NOTE_SET),id(MESSAGE,~)) )
			}
		}
		NOTE {
			maluuba_hint = disabled
			intent {
				(<$(@memo)/title-spec:id(intent,NOTE_SET)> | (~\0:id(intent,NOTE_SET),id(MESSAGE,~)) )
			}
		}
		NOTE_EDIT {
			maluuba_hint = disabled
			intent {
				(<$(@memo)/note-fields>)
			}
		}
		REMINDER_EDIT {
			maluuba_hint = "\\\"handlerType\\\":\\\"REMINDER_INPUT\\\""
			intent {
				(<$(@memo)/reminder-fields:bonus(60000)>)
			}
		}
		APPLICATION {
			maluuba_hint = disabled
			recognizer = dragon
			recognizer = vocon3200 {
				context = \$(locale-dir)/launcher/launcher.fcf {
					trained-dir = trained/launcher
					confidence_threshold = 3400
					loadslot {
						personal_apps {
							context = $(trained-dir)/personal.lcf
						}
						work_apps {
							context = $(trained-dir)/work.lcf
						}
						pre_lude {
							context = $(trained-dir)/pre_app.lcf
						}
					}
					deactivate {
						*
					}
					activate {
						JustApp
						cancel
						HELP_HELP
						back
					}
				}
			}
			intent {
				<$(@launch)/intent>
			}
		}
		LIST_WIDE {
			maluuba_hint = disabled
			recognizer = vocon3200 {
				garbage-sensitivity = 56
				context = \$(locale-dir)/bb10_addrbook/dial.fcf {
					deactivate {
						*
					}
					activate {
						list
						cancel
						HELP_HELP
						back
					}
				}
				context = \$(locale-dir)/common/common.fcf {
					loadslot {
						item {
							context = trained/common/items.lcf
						}
					}
						deactivate {
							*
						}
						activate {
							OpenListWords
						}
				}
			}
			intent {
				#ref. the items trained from the intent directive provided list
				<$(@common)/LIST:bonus(200000)>
				</asr-config/module/common/items:id(INDEX,!value),id(intent,LIST),id(LISTITEM),bonus(150000)>
			}
		}
		LIST {
			maluuba_hint = disabled
			recognizer = vocon3200 {
				garbage-sensitivity = 56
				context = \$(locale-dir)/bb10_addrbook/dial.fcf {
					deactivate {
						*
					}
					activate {
						list
						cancel
						HELP_HELP
						back
					}
				}
				context = \$(locale-dir)/common/common.fcf {
					loadslot {
						item {
							context = trained/common/items.lcf
						}
					}
					deactivate {
						*
					}
					activate {
						ListWords
					}
				}
			}
			intent {
				<$(@common)/LIST:bonus(200000)>
				#ref. the items trained from the intent directive provided list
				</asr-config/module/common/items:id(INDEX,!value),id(intent,LIST),id(LISTITEM),bonus(450000)>
			}
		}
		
	# 	Maluuba Generic Handlers
		INPUT_CONFIRMATION {
			maluuba_hint = "\\\"handlerType\\\":\\\"CONFIRMATION\\\""
			maluuba_parameters = {\\\"actionWords\\\":[\\\"GGG\\\"]}
			recognizer = dragon
			intent {
				<$(@common)/input-confirmation:bonus(200000)>
			}
			recognizer = vocon3200 {
				context = \$(locale-dir)/bb10_addrbook/dial.fcf {
					deactivate {
						*
					}
					activate {
						confirm
						cancel
						HELP_HELP
						back
					}
				}
			}
		}
		INPUT_TIME {
			intent
			recognizer = dragon
			recognizer = vocon3200
			maluuba_hint = "\\\"handlerType\\\":\\\"INPUT_TIME\\\""
		}
		INPUT_DATE {
			intent
			recognizer = dragon
			recognizer = vocon3200
			maluuba_hint = "\\\"handlerType\\\":\\\"INPUT_DATE\\\""
		}
		INPUT_TIME_ANDOR_DATE {
			intent
			recognizer = dragon
			recognizer = vocon3200
			maluuba_hint = "\\\"handlerType\\\":\\\"INPUT_TIME_ANDOR_DATE\\\""
		}

	#	Maluuba Contextual Handlers
		ALARM_BY_TIME {
			intent
			recognizer = dragon
			recognizer = vocon3200
			maluuba_hint = "\\\"handlerType\\\":\\\"ALARM_INPUT\\\""
		}
		TIMER_INPUT {
			intent
			recognizer = dragon
			recognizer = vocon3200
			maluuba_hint = "\\\"handlerType\\\":\\\"ALARM_TIMER_INPUT\\\""
		}
		CALENDAR {
			intent
			recognizer = dragon
			recognizer = vocon3200
			maluuba_hint = "\\\"handlerType\\\":\\\"CONTEXTUAL\\\",\\\"frameClassification\\\":\\\"CALENDAR\\\""
		}
		NAVIGATION {
			intent
			recognizer = dragon
			recognizer = vocon3200
			maluuba_hint = "\\\"handlerType\\\":\\\"CONTEXTUAL\\\",\\\"frameClassification\\\":\\\"NAVIGATION\\\""
		}
		
	#	Maluuba Specialized Handlers
		CALENDAR_ADD_EVENT_OR_CHANGE_CONFIRMATION {
			intent 
			recognizer = dragon
			recognizer = vocon3200
			maluuba_hint = "\\\"handlerType\\\":\\\"CALENDAR_ADD_EVENT_OR_CHANGE_CONFIRMATION\\\""
			maluuba_parameters = {\\\"fields\\\":[\\\"MEETINGTITLE\\\",\\\"TIMERANGE\\\",\\\"LOCATION\\\",\\\"DATERANGE\\\",\\\"CONTACTNAME\\\"],\\\"addActionWords\\\":[\\\"GGG\\\"],\\\"makeChangesActionWords\\\":[\\\"QQQ\\\"]}
		}
		CALENDAR_CONFLICT_CONFIRMATION {
			intent
			recognizer = dragon
			recognizer = vocon3200
			maluuba_hint = "\\\"handlerType\\\":\\\"CALENDAR_CONFLICT_CONFIRMATION\\\""
			maluuba_parameters = {\\\"addActionWords\\\":[\\\"GGG\\\"],\\\"makeChangesActionWords\\\":[\\\"QQQ\\\"]}
		}
		CALENDAR_CHANGE_DETAILS {
			intent
			recognizer = dragon
			recognizer = vocon3200
			maluuba_hint = "\\\"handlerType\\\":\\\"CALENDAR_CHANGE_DETAILS\\\""
			maluuba_parameters = {\\\"fields\\\":[\\\"MEETINGTITLE\\\",\\\"TIMERANGE\\\",\\\"LOCATION\\\",\\\"DATERANGE\\\",\\\"CONTACTNAME\\\"],\\\"addActionWords\\\":[\\\"GGG\\\"]}
		}
		CALENDAR_SEARCH_DRILLDOWN {
			intent
			recognizer = dragon
			recognizer = vocon3200
			maluuba_hint = "\\\"handlerType\\\":\\\"CALENDAR_SEARCH_DRILLDOWN\\\""
		}
		REMINDER_CREATE_CONFIRMATION {
			intent
			recognizer = dragon
			recognizer = vocon3200
			maluuba_hint = "\\\"handlerType\\\":\\\"REMINDER_CREATE_CONFIRMATION\\\""
			maluuba_parameters = {\\\"actionWords\\\":[\\\"GGG\\\"]}
		}
		REMINDER_INPUT {
			intent
			recognizer = dragon
			recognizer = vocon3200
			maluuba_hint = "\\\"handlerType\\\":\\\"REMINDER_INPUT\\\""
		}
		MESSAGE_REPLY_CONFIRMATION{
			intent
			recognizer = dragon
			recognizer = vocon3200
			maluuba_hint = "\\\"handlerType\\\":\\\"MESSAGE_REPLY_CONFIRMATION\\\""
			maluuba_parameters = {\\\"actionWords\\\":[\\\"GGG\\\"]}
		}
		MESSAGE_SEND_CONFIRMATION {
			intent
			recognizer = dragon
			recognizer = vocon3200
			maluuba_hint = "\\\"handlerType\\\":\\\"MESSAGE_SEND_CONFIRMATION\\\""
			maluuba_parameters = {\\\"actionWords\\\":[\\\"GGG\\\"]}
		}
		MESSAGE_EMAIL_ACTIONS {
			intent
			recognizer = dragon
			recognizer = vocon3200
			maluuba_hint = "\\\"handlerType\\\":\\\"MESSAGE_EMAIL_ACTIONS\\\",\\\"frameClassification\\\":\\\"MESSAGING_SEND\\\""
			maluuba_parameters = {\\\"replyActionWord\\\":\\\"RRR\\\",\\\"replyAllActionWord\\\":\\\"AAA\\\",\\\"forwardActionWord\\\":\\\"FFF\\\"}
		}
		MESSAGING_READ_DRILLDOWN {
			intent
			recognizer = dragon
			recognizer = vocon3200
			maluuba_hint = "\\\"handlerType\\\":\\\"MESSAGING_READ_DRILLDOWN\\\""
		}
		MESSAGE_RESUME_DICTATION_CONFIRMATION {
			intent
			recognizer = dragon
			recognizer = vocon3200
			maluuba_hint = "\\\"handlerType\\\":\\\"MESSAGE_RESUME_DICTATION_CONFIRMATION\\\""
			maluuba_parameters = {\\\"actionWords\\\":[\\\"GGG\\\"],\\\"numMessages\\\":4}
		}
		NAVIGATION_DIRECTIONS_CONFIRMATION {
			intent
			recognizer = dragon
			recognizer = vocon3200
			maluuba_hint = "\\\"handlerType\\\":\\\"NAVIGATION_DIRECTIONS_CONFIRMATION\\\""
			maluuba_parameters = {\\\"actionWords\\\":[\\\"GGG\\\"]}
		}
		CONFIRMATION {
			maluuba_hint = disabled
			intent {
				<$(@common)/confirmation:bonus(200000)>
			}
			recognizer = vocon3200 {
				context = \$(locale-dir)/bb10_addrbook/dial.fcf {
					deactivate {
						*
					}
					activate {
						confirm
						cancel
						HELP_HELP
						back
					}
				}
			}
			CALL {
				recognizer = dragon
				recognizer = vocon3200 {
					context = \$(locale-dir)/bb10_addrbook/dial.fcf {
						deactivate {
							*
						}
						activate {
							confirm
							cancel
							HELP_HELP
							back
						}
					}
				}
				maluuba_hint = disabled
				intent {
					<$(@common)/confirmation>(~\0)(:done(180000))
					</asr-config/module/bb10_addrbook/localized/confirmation/intent:bonus(200000)>
				}
			}
			TWEET {
				intent
				recognizer = dragon
				recognizer = vocon3200
				maluuba_hint = "\\\"handlerType\\\":\\\"MESSAGE_SEND_CONFIRMATION\\\""
				maluuba_parameters = {\\\"actionWords\\\":[\\\"GGG\\\"]}
			}
			MESSAGING {
				intent
				recognizer = dragon
				recognizer = vocon3200
				maluuba_hint = "\\\"handlerType\\\":\\\"MESSAGE_SEND_CONFIRMATION\\\""
				maluuba_parameters = {\\\"actionWords\\\":[\\\"GGG\\\"]}
			}
			READER {
				intent
				recognizer = dragon
				recognizer = vocon3200
				<$(@common)/confirmation:bonus(200000)>
				</asr-config/module/messages/localized/message-confirmation/intent:bonus(200000)>
			}
			CALENDAR_CREATE {
				recognizer = dragon
				recognizer = vocon3200
				maluuba_hint = "\\\"handlerType\\\":\\\"CONTEXTUAL\\\",\\\"frameClassification\\\":\\\"CALENDAR_CREATE_EVENT\\\""
				intent {
					<$(@common)/confirmation>(~\0)(:done(180000))
					<$(@calendar)/confirmation:done(190000)>
				}
			}
			CALENDAR	 {
				intent
				recognizer = dragon
				recognizer = vocon3200
				maluuba_hint = "\\\"handlerType\\\":\\\"CALENDAR_ADD_EVENT_OR_CHANGE_CONFIRMATION\\\""
				maluuba_parameters = {\\\"fields\\\":[\\\"MEETINGTITLE\\\",\\\"TIMERANGE\\\",\\\"LOCATION\\\",\\\"DATERANGE\\\",\\\"CONTACTNAME\\\"],\\\"addActionWords\\\":[\\\"GGG\\\"],\\\"makeChangesActionWords\\\":[\\\"QQQ\\\"]}
			}
			MESSAGING_SEND {
				maluuba_hint = "\\\"handlerType\\\":\\\"MESSAGE_SEND_CONFIRMATION\\\""
				maluuba_parameters = {\\\"actionWords\\\":[\\\"rrr\\\"]}
			}
		}
		MESSAGING_READ {
			intent
			recognizer = dragon
			recognizer = vocon3200
			maluuba_hint = "\\\"handlerType\\\":\\\"MESSAGE_EMAIL_ACTIONS\\\""
			maluuba_parameters = {\\\"replyActionWord\\\":\\\"GGG\\\",\\\"replyAllActionWord\\\":\\\"QQQ\\\",\\\"forwardActionWord\\\":\\\"FFF\\\"}
		}
		NAVIGATION_ROUTE{
			maluuba_hint = "\\\"handlerType\\\":\\\"CONTEXTUAL\\\",\\\"frameClassification\\\":\\\"NAVIGATION_ROUTE_FROM_X_TO_Y\\\""
		}
		NOTE_CREATE_CONFIRMATION {
			maluuba_hint = disabled
			recognizer = dragon
			recognizer = vocon3200
			intent {
				<$(@common)/confirmation:bonus(200000)>
				<$(@memo)/note-confirmation:bonus(202000)>
			}
		}
